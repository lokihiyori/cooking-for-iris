<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking for Iris 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Landing Page -->
  <div id="landing-page" class="page active">
    <div class="landing-bg">
      <div class="floating-emoji e1">🍳</div>
      <div class="floating-emoji e2">🥘</div>
      <div class="floating-emoji e3">🍰</div>
      <div class="floating-emoji e4">🥗</div>
      <div class="floating-emoji e5">🍝</div>
      <div class="floating-emoji e6">❤️</div>
    </div>
    <div class="landing-content">
      <h1 class="landing-title">Cooking for Iris</h1>
      <p class="landing-subtitle">Made with love, served with heart</p>
      <div class="landing-cards">
        <button class="landing-card iris-card" onclick="enterAs('iris')">
          <div class="card-emoji">👩‍🍳</div>
          <h2>Iris's Menu</h2>
          <p>Browse dishes & place your order</p>
          <span class="card-btn">Open Menu →</span>
        </button>
        <div class="landing-heart">💕</div>
        <button class="landing-card chef-card" onclick="enterAs('chef')">
          <div class="card-emoji">👨‍🍳</div>
          <h2>Chef Lucas</h2>
          <p>View orders & manage dishes</p>
          <span class="card-btn">Kitchen →</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Iris Menu Page -->
  <div id="iris-page" class="page">
    <nav class="navbar iris-nav">
      <button class="back-btn" onclick="goHome()">← Home</button>
      <h1 class="nav-title">✨ Menu for Iris ✨</h1>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 <span id="cart-count">0</span>
      </button>
    </nav>

    <div class="iris-container">
      <div class="menu-header">
        <h2>What would you like today, love? 💗</h2>
        <div class="category-filters" id="category-filters"></div>
      </div>

      <div class="menu-grid" id="menu-grid"></div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <h2>Your Order 💌</h2>
        <button class="close-cart" onclick="toggleCart()">✕</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer" id="cart-footer">
        <textarea id="order-notes" placeholder="Any special notes for Lucas? 💬" rows="3"></textarea>
        <button class="place-order-btn" onclick="placeOrder()">
          💕 Place Order
        </button>
      </div>
    </div>

    <!-- Dish Detail Modal -->
    <div class="modal-overlay" id="dish-modal" onclick="closeModal(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDishModal()">✕</button>
        <div class="modal-emoji" id="modal-emoji"></div>
        <h2 id="modal-title"></h2>
        <p class="modal-desc" id="modal-description"></p>
        <div class="modal-meta">
          <span class="modal-time" id="modal-time"></span>
          <span class="modal-category" id="modal-category"></span>
        </div>
        <button class="modal-add-btn" id="modal-add-btn">Add to Order 🛒</button>
      </div>
    </div>
  </div>

  <!-- Chef Page -->
  <div id="chef-page" class="page">
    <nav class="navbar chef-nav">
      <button class="back-btn" onclick="goHome()">← Home</button>
      <h1 class="nav-title">👨‍🍳 Chef Lucas's Kitchen</h1>
      <button class="add-dish-btn" onclick="openAddDish()">+ New Dish</button>
    </nav>

    <div class="chef-container">
      <div class="chef-tabs">
        <button class="chef-tab active" data-tab="orders" onclick="switchChefTab('orders')">
          📋 Orders <span class="order-badge" id="order-badge">0</span>
        </button>
        <button class="chef-tab" data-tab="all-dishes" onclick="switchChefTab('all-dishes')">
          📖 All Dishes
        </button>
      </div>

      <div class="chef-panel active" id="orders-panel">
        <div id="orders-list" class="orders-list"></div>
      </div>

      <div class="chef-panel" id="all-dishes-panel">
        <div id="all-dishes-list" class="dishes-manage-list"></div>
      </div>
    </div>

    <!-- Add Dish Modal -->
    <div class="modal-overlay" id="add-dish-modal" onclick="closeModal(event)">
      <div class="modal-content add-dish-form" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeAddDish()">✕</button>
        <h2>Add New Dish 🍽️</h2>
        <form onsubmit="saveDish(event)" id="dish-form">
          <div class="form-group">
            <label>Dish Name</label>
            <input type="text" id="dish-name" required placeholder="e.g. Chicken Alfredo">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Emoji Icon</label>
              <input type="text" id="dish-emoji" required placeholder="🍝" maxlength="4">
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="dish-category" required>
                <option value="">Select...</option>
                <option value="Appetizers">Appetizers</option>
                <option value="Main Course">Main Course</option>
                <option value="Pasta">Pasta</option>
                <option value="Salads">Salads</option>
                <option value="Soups">Soups</option>
                <option value="Desserts">Desserts</option>
                <option value="Drinks">Drinks</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="dish-desc" required placeholder="A short, appetizing description..." rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>Cook Time</label>
            <input type="text" id="dish-time" required placeholder="e.g. 30 mins">
          </div>
          <div class="form-group">
            <label>Ingredients (one per line)</label>
            <textarea id="dish-ingredients" required placeholder="200g pasta&#10;100g bacon&#10;2 eggs&#10;..." rows="5"></textarea>
          </div>
          <div class="form-group">
            <label>Recipe Steps (one per line)</label>
            <textarea id="dish-recipe" required placeholder="Boil pasta until al dente&#10;Fry bacon until crispy&#10;..." rows="6"></textarea>
          </div>
          <button type="submit" class="save-dish-btn">Save Dish ✨</button>
        </form>
      </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="order-detail-modal" onclick="closeModal(event)">
      <div class="modal-content order-detail" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeOrderDetail()">✕</button>
        <div id="order-detail-content"></div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Order Success -->
  <div class="order-success-overlay" id="order-success">
    <div class="order-success-content">
      <div class="success-hearts">💕</div>
      <h2>Order Placed!</h2>
      <p>Lucas will start cooking for you soon! 👨‍🍳</p>
      <button onclick="closeOrderSuccess()">Yay! ✨</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
